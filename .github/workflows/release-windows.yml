name: Build & Release Windows Desktop App

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake (MSVC x64)
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Build Release Binaries
        run: cmake --build build --config Release

      - name: Run Automated Test Suite
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package Portable Distribution
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/Reclaim-Portable-x64 | Out-Null
          Copy-Item build/Release/Reclaim.exe dist/Reclaim-Portable-x64/
          Copy-Item build/Release/reclaim-cli.exe dist/Reclaim-Portable-x64/
          Copy-Item assets/rules.json dist/Reclaim-Portable-x64/
          Copy-Item README.md, LICENSE dist/Reclaim-Portable-x64/
          Compress-Archive -Path dist/Reclaim-Portable-x64/* -DestinationPath dist/Reclaim-1.1.0-win64-portable.zip

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: reclaim-windows-x64-v1.1.0
          path: |
            build/Release/Reclaim.exe
            build/Release/reclaim-cli.exe
            dist/Reclaim-1.1.0-win64-portable.zip

  verify-linux-asan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build & Run Core Tests + ASan/UBSan
        run: make all asan
